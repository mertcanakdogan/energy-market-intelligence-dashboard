# Theme tokens of the "price leakage" design. Meaning of each colour: DESIGN.md.
# Two system families, present on every Windows and Mac and in Microsoft 365: Arial and
# Georgia (Georgia is set in the CSS of dashboard_style.py). Nothing is downloaded.
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F5"
textColor = "#1B2430"
linkColor = "#1F3A5F"
borderColor = "#E3E7EA"
redColor = "#C8462B"
greenColor = "#2E7D5B"
blueColor = "#1F3A5F"
grayColor = "#6B7480"
redTextColor = "#C8462B"
greenTextColor = "#27704F"
blueTextColor = "#1F3A5F"
baseRadius = "4px"
buttonRadius = "4px"
font = "Arial, Helvetica, sans-serif"
headingFont = "Arial, Helvetica, sans-serif"
codeFont = "Arial, Helvetica, sans-serif"
headingFontSizes = ["2.5rem", "1.6rem", "1.35rem", "1.125rem", "1rem", "1rem"]
headingFontWeights = [700, 400, 400, 700, 700, 700]

[theme.sidebar]
backgroundColor = "#F2F4F5"
secondaryBackgroundColor = "#E3E7EA"

[client]
toolbarMode = "minimal"

[server]
headless = true
