[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-market-intelligence-dashboard"
version = "2.1.0"
description = "Synthetic pricing and revenue analytics case study for a fictional Turkish electricity retailer: price waterfall, PVM bridge, elasticity, promotion DiD and price recommendations (TL, Turkish app)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mert Can Akdoğan"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "duckdb>=1.2,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "PyYAML>=6.0,<7",
  "statsmodels>=0.14,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "kaleido>=1.1,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
energy-market-pipeline = "energy_market_intelligence.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["energy_market_intelligence"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
