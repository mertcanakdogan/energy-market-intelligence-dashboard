name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 3.14 is the main version (Streamlit Cloud, devcontainer). 3.15 is informational until
    # DuckDB publishes Python 3.15 wheels; then it becomes the main version.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        # Binary-only DuckDB: fail fast instead of compiling it when no wheel exists yet.
        run: python -m pip install --only-binary=duckdb -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing
